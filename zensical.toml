[project]
site_name = "nhsy-hcp"
site_url = "https://nhsy-hcp.github.io/"
site_description = "Hands-on labs for HashiCorp Vault, Nomad, Consul and Terraform on GCP, Kubernetes and Docker."
site_author = "nhsy-hcp"

copyright = "Copyright &copy; 2026 nhsy-hcp"

repo_name = "nhsy-hcp"
repo_url = "https://github.com/nhsy-hcp"

nav = [
  { "Home" = "index.md" },
  { "Repositories" = [
    { "Overview" = "repositories/index.md" },
    { "Nomad" = "repositories/nomad.md" },
    { "Terraform" = "repositories/terraform.md" },
    { "Vault" = "repositories/vault.md" },
  ] },
  { "Tags" = "tags.md" },
  { "About" = "about.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
# "classic" preserves the Material for MkDocs look that docs/stylesheets/extra.css
# is written against (.md-tabs, .md-header, data-md-color-scheme, ...).
variant = "classic"
custom_dir = "docs/overrides"
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nhsy-hcp"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/narish-samplay/"

[project.plugins.search]

[project.plugins.tags]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3

pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
