name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the artifact-based Pages flow does not push to a branch,
# so contents is read-only (the old gh-deploy flow needed contents: write).
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No dependency cache: Zensical's publishing docs advise against caching
      # on CI while that functionality is being revised. See MIGRATION_NOTES.md.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --frozen

      # --strict aborts on warnings, including broken internal links.
      - name: Build site
        run: uv run zensical build --clean --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
